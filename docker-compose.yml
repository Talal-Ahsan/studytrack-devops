services:
  db:
    image: mysql:8.0
    container_name: studytrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studytrack_db
    ports:
      - "3307:3306"
    volumes:
      - studytrack_db_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: studytrack-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: studytrack_db
      DB_PORT: 3306
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  studytrack_db_data: