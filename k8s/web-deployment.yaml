apiVersion: apps/v1
kind: Deployment
metadata:
  name: studytrack-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studytrack-web
  template:
    metadata:
      labels:
        app: studytrack-web
    spec:
      containers:
        - name: studytrack-web
          image: studytrack-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: studytrack-mysql-service
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: root
            - name: DB_NAME
              value: studytrack_db
            - name: DB_PORT
              value: "3306"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5